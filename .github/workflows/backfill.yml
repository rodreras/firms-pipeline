name: FIRMS historical backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First day (YYYY-MM-DD). Defaults to 2000-01-01.
        type: string
      end_date:
        description: Last day (YYYY-MM-DD). Defaults to the dispatch date in UTC.
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  backfill:
    uses: ./.github/workflows/publish.yml
    with:
      mode: backfill
      start_date: ${{ inputs.start_date }}
      end_date: ${{ inputs.end_date }}
    secrets: inherit