name: Pull request checks

on: pull_request

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Ruff lint
        run: uvx ruff@0.15.10 check .
      - name: Ruff formatting for changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.py' > "$RUNNER_TEMP/changed-python"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python"
          if (( ${#files[@]} )); then
            uvx ruff@0.15.10 format --check -- "${files[@]}"
          fi
      - name: Tests
        run: uv run --no-sync python -m unittest discover -s tests -v

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Scan pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --log-opts="$BASE_SHA..HEAD"
