name: Push checks

on: push

permissions:
  contents: read

jobs:
  python:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra visualization
      - name: Ruff lint
        run: uvx ruff@0.15.10 check .
      - name: Ruff formatting for changed Python files
        env:
          BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.py'
          else
            git ls-files -z -- '*.py'
          fi > "$RUNNER_TEMP/changed-python"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python"
          if (( ${#files[@]} )); then
            uvx ruff@0.15.10 format --check -- "${files[@]}"
          fi
      - name: Tests
        run: uv run --no-sync python -m unittest discover -s tests -v

  secrets:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Scan pushed commits
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          log_opts=HEAD
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            log_opts="$BASE_SHA..HEAD"
          fi
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --log-opts="$log_opts"
