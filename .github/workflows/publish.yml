name: Publish FIRMS to GCS

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      start_date:
        type: string
      end_date:
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: firms-production
    concurrency:
      group: firms-production-publisher
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
      - name: Plan ingestion dates
        env:
          GH_TOKEN: ${{ github.token }}
          INGESTION_MODE: ${{ inputs.mode }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        shell: bash
        run: |
          run_created_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          python -m src.workflow_dates "$INGESTION_MODE" "${run_created_at%%T*}" \
            --start-date="$START_DATE" --end-date="$END_DATE" > "$RUNNER_TEMP/firms-intervals"
          cat "$RUNNER_TEMP/firms-intervals"
      - run: uv sync --locked
      - name: Install DuckDB H3
        run: uv run --no-sync python -c "import duckdb; duckdb.connect().execute('INSTALL h3 FROM community')"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Ingest and publish
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GCLOUD_URI: ${{ secrets.GCLOUD_URI }}
          GCLOUD_PRIVATE_URI: ${{ secrets.GCLOUD_PRIVATE_URI }}
        shell: bash
        run: |
          : "${FIRMS_MAP_KEY:?Set the FIRMS_MAP_KEY environment secret}"
          : "${GCLOUD_URI:?Set the GCLOUD_URI environment secret}"
          : "${GCLOUD_PRIVATE_URI:?Set the GCLOUD_PRIVATE_URI environment secret}"
          while read -r start_date end_date; do
            uv run --no-sync python -m src.cloud \
              --start-date "$start_date" --end-date "$end_date" --transaction-limit 5000
          done < "$RUNNER_TEMP/firms-intervals"
